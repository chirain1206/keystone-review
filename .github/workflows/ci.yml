name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的连续 push / PR 更新时，取消仍在运行的旧任务，节省时间
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 无真实密钥时应用自动进入 MOCK 模式，构建无需任何 secret。
      # 以下 NEXT_PUBLIC_* 用安全的空占位，避免 Next.js 构建期内联失败。
      NEXT_PUBLIC_SUPABASE_URL: ""
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
